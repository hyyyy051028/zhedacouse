<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业家研修报名信息</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>企业家研修报名信息</h1>
            <p class="subtitle">请填写以下信息完成报名</p>
        </header>

        <form id="registrationForm" class="form-container">
            <!-- 基本信息 -->
            <section class="form-section">
                <div class="section-header">
                    <span class="section-number">01</span>
                    <h2>基本信息</h2>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">姓名 <span class="required">*</span></label>
                        <input type="text" id="name" name="姓名" required placeholder="请输入姓名">
                    </div>

                    <div class="form-group">
                        <label for="advisor">招生老师 <span class="required">*</span></label>
                        <select id="advisor" name="招生老师" required>
                            <option value="">请选择</option>
                            <option value="贺海燕">贺海燕</option>
                            <option value="刘婷">刘婷</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="position">职务 <span class="required">*</span></label>
                        <select id="position" name="职务" required>
                            <option value="">请选择</option>
                            <option value="董事长">董事长</option>
                            <option value="总经理">总经理</option>
                            <option value="CEO">CEO</option>
                            <option value="其他高管">其他高管</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phone">手机号 <span class="required">*</span></label>
                        <input type="tel" id="phone" name="手机号" required placeholder="请输入手机号" pattern="1[3-9]\d{9}">
                        <span class="error-msg" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="education">最高学历 <span class="required">*</span></label>
                        <select id="education" name="最高学历" required>
                            <option value="">请选择</option>
                            <option value="高中及以下">高中及以下</option>
                            <option value="大专">大专</option>
                            <option value="本科">本科</option>
                            <option value="硕士">硕士</option>
                            <option value="博士">博士</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="school">毕业院校</label>
                        <input type="text" id="school" name="毕业院校" placeholder="请输入毕业院校">
                    </div>
                </div>
            </section>

            <!-- 企业信息 -->
            <section class="form-section">
                <div class="section-header">
                    <span class="section-number">02</span>
                    <h2>企业信息</h2>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company">单位名称 <span class="required">*</span></label>
                        <input type="text" id="company" name="单位名称" required placeholder="请输入单位名称">
                    </div>

                    <div class="form-group">
                        <label for="idCard">身份证号码 <span class="required">*</span></label>
                        <input type="text" id="idCard" name="身份证号码" required placeholder="请输入18位身份证号码" maxlength="18">
                        <span class="error-msg" id="idCardError"></span>
                    </div>

                    <div class="form-group">
                        <label for="industry">所属行业 <span class="required">*</span></label>
                        <select id="industry" name="所属行业" required>
                            <option value="">请选择</option>
                            <option value="制造业">制造业</option>
                            <option value="服务业">服务业</option>
                            <option value="互联网/科技">互联网/科技</option>
                            <option value="金融">金融</option>
                            <option value="房地产">房地产</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="companySize">企业规模 <span class="required">*</span></label>
                        <select id="companySize" name="企业规模" required>
                            <option value="">请选择</option>
                            <option value="50人以下">50人以下</option>
                            <option value="51-200人">51-200人</option>
                            <option value="201-500人">201-500人</option>
                            <option value="501-1000人">501-1000人</option>
                            <option value="1000人以上">1000人以上</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="licensePlate">车牌号</label>
                        <input type="text" id="licensePlate" name="车牌号" placeholder="请输入车牌号">
                    </div>

                    <div class="form-group">
                        <label for="managementYears">管理年限 <span class="required">*</span></label>
                        <select id="managementYears" name="管理年限" required>
                            <option value="">请选择</option>
                            <option value="5年以内">5年以内</option>
                            <option value="5-10年">5-10年</option>
                            <option value="10-15年">10-15年</option>
                            <option value="15年以上">15年以上</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="annualRevenue">年销售额 <span class="required">*</span></label>
                        <select id="annualRevenue" name="年销售额" required>
                            <option value="">请选择</option>
                            <option value="1000万以下">1000万以下</option>
                            <option value="1000万-5000万">1000万-5000万</option>
                            <option value="5000万-1亿">5000万-1亿</option>
                            <option value="1亿-5亿">1亿-5亿</option>
                            <option value="5亿以上">5亿以上</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="city">居住城市</label>
                        <input type="text" id="city" name="居住城市" placeholder="请输入居住城市">
                    </div>
                </div>
            </section>

            <!-- 报名信息 -->
            <section class="form-section">
                <div class="section-header">
                    <span class="section-number">03</span>
                    <h2>报名信息</h2>
                </div>
                
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="project">报名项目 <span class="required">*</span></label>
                        <select id="project" name="报名项目" required>
                            <option value="">请选择</option>
                            <option value="AI实战研修班">AI实战研修班</option>
                            <option value="数字化转型研修班">数字化转型研修班</option>
                            <option value="领导力提升班">领导力提升班</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="expectations">学习期望</label>
                        <textarea id="expectations" name="学习期望" rows="4" placeholder="请描述您的学习期望..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isPaid" name="是否缴费">
                            <span class="checkmark"></span>
                            是否已缴费
                        </label>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">提交报名</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span>
                        提交中...
                    </span>
                </button>
            </div>
        </form>

        <!-- 成功提示 -->
        <div id="successModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="success-icon">✓</div>
                <h3>报名成功！</h3>
                <p>您的报名信息已提交，我们会尽快与您联系。</p>
                <button onclick="closeModal()" class="modal-btn">确定</button>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="errorToast" class="toast" style="display: none;">
            <span id="errorMsg"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
