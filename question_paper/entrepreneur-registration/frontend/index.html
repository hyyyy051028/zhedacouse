<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浙江大学 企业家研修报名系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>浙江大学 企业家研修报名系统</h1>
            <p class="subtitle">填写以下信息完成报名，我们将尽快与您联系</p>
        </div>
        
        <!-- 主要内容 -->
        <div class="main-content">
            <!-- 报名表单 -->
            <div class="form-card">
                <h2 class="form-title">报名信息</h2>
                
                <form id="registrationForm">
                    <!-- 个人信息组 -->
                    <div class="form-section">
                        <h3 class="section-title">个人信息</h3>
                        
                        <div class="form-group">
                            <label class="question-title">姓名 *</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="请输入您的姓名" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">招生老师 *</label>
                            <select class="form-control" id="admissionTeacher" name="admissionTeacher" required>
                                <option value="">请选择招生老师</option>
                                <option value="贺海燕">贺海燕</option>
                                <option value="刘婷">刘婷</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">职务 *</label>
                            <select class="form-control" id="position" name="position" required>
                                <option value="">请选择职务</option>
                                <option value="董事长">董事长</option>
                                <option value="总经理">总经理</option>
                                <option value="CEO">CEO</option>
                                <option value="其他高管">其他高管</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">手机号 *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入您的手机号码" required>
                            <div class="error-message" id="phoneError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">身份证号码 *</label>
                            <input type="text" class="form-control" id="idCard" name="idCard" placeholder="请输入您的身份证号码" required>
                            <div class="error-message" id="idCardError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">最高学历 *</label>
                            <select class="form-control" id="education" name="education" required>
                                <option value="">请选择最高学历</option>
                                <option value="高中及以下">高中及以下</option>
                                <option value="大专">大专</option>
                                <option value="本科">本科</option>
                                <option value="硕士">硕士</option>
                                <option value="博士">博士</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">毕业院校</label>
                            <input type="text" class="form-control" id="graduationSchool" name="graduationSchool" placeholder="请输入您的毕业院校">
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">居住城市</label>
                            <input type="text" class="form-control" id="city" name="city" placeholder="请输入您的居住城市">
                        </div>
                    </div>
                    
                    <!-- 企业信息组 -->
                    <div class="form-section">
                        <h3 class="section-title">企业信息</h3>
                        
                        <div class="form-group">
                            <label class="question-title">单位名称 *</label>
                            <input type="text" class="form-control" id="company" name="company" placeholder="请输入您的单位名称" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">所属行业 *</label>
                            <select class="form-control" id="industry" name="industry" required>
                                <option value="">请选择所属行业</option>
                                <option value="制造业">制造业</option>
                                <option value="服务业">服务业</option>
                                <option value="互联网/科技">互联网/科技</option>
                                <option value="金融">金融</option>
                                <option value="房地产">房地产</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">企业规模 *</label>
                            <select class="form-control" id="companySize" name="companySize" required>
                                <option value="">请选择企业规模</option>
                                <option value="50人以下">50人以下</option>
                                <option value="51-200人">51-200人</option>
                                <option value="201-500人">201-500人</option>
                                <option value="501-1000人">501-1000人</option>
                                <option value="1000人以上">1000人以上</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">管理年限 *</label>
                            <select class="form-control" id="managementYears" name="managementYears" required>
                                <option value="">请选择管理年限</option>
                                <option value="5年以内">5年以内</option>
                                <option value="5-10年">5-10年</option>
                                <option value="10-15年">10-15年</option>
                                <option value="15年以上">15年以上</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">年销售额 *</label>
                            <select class="form-control" id="annualSales" name="annualSales" required>
                                <option value="">请选择年销售额</option>
                                <option value="1000万以下">1000万以下</option>
                                <option value="1000万-5000万">1000万-5000万</option>
                                <option value="5000万-1亿">5000万-1亿</option>
                                <option value="1亿-5亿">1亿-5亿</option>
                                <option value="5亿以上">5亿以上</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">车牌号</label>
                            <input type="text" class="form-control" id="licensePlate" name="licensePlate" placeholder="请输入您的车牌号">
                        </div>
                    </div>
                    
                    <!-- 报名信息组 -->
                    <div class="form-section">
                        <h3 class="section-title">报名信息</h3>
                        
                        <div class="form-group">
                            <label class="question-title">报名项目 *</label>
                            <select class="form-control" id="program" name="program" required>
                                <option value="">请选择报名项目</option>
                                <option value="AI实战研修班">AI实战研修班</option>
                                <option value="数字化转型研修班">数字化转型研修班</option>
                                <option value="领导力提升班">领导力提升班</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">学习期望</label>
                            <textarea class="form-control" id="expectations" name="expectations" placeholder="请描述您的学习期望"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label class="question-title">是否缴费 *</label>
                            <div class="checkbox-item">
                                <input type="checkbox" id="isPaid" name="isPaid" value="true">
                                <label for="isPaid">是</label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 提交按钮 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
                        <button type="submit" class="btn btn-primary">提交报名</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            <p>© 2026 浙江大学传媒国际文化经济高培中心 版权所有</p>
            <p>地址：浙江省杭州市上城区凯旋路268号浙江大学华家池校区</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
