<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浙江大学AI实战研修班</title>
    <link rel="stylesheet" href="./shared/floating-teacher-btn.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        .img-container {
            width: 100%;
        }
        .img-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 悬浮报名按钮样式 */
        .floating-btn {
            position: fixed;
            top: 50%;
            right: 0; /* 紧贴右侧边缘 */
            transform: translateY(-50%) scale(calc(1 / var(--zoom-level, 1)));
            transform-origin: right center; /* 缩放基准点靠右 */
            background: rgba(255, 255, 255, 0.95); /* 黑白简约：白色背景 */
            color: #000; /* 纯黑文字 */
            border: 2px solid #000; /* 黑色边框 */
            font-weight: bold;
            font-size: 24px; /* 调大字体 */
            padding: 20px 25px; /* 调整内边距 */
            border-radius: 30px 0 0 30px; /* 左侧圆角，右侧直角 */
            border-right: none; /* 靠屏幕右侧，去掉右边框 */
            text-decoration: none;
            box-shadow: -5px 10px 20px rgba(0, 0, 0, 0.15); /* 柔和的黑色阴影 */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px; /* 增加图标和文字间距 */
            overflow: hidden;
            writing-mode: vertical-lr; /* 文字竖排 */
            letter-spacing: 6px; /* 增加字间距 */
        }
        
        .floating-btn svg {
            transform: rotate(-90deg); /* 因为是竖排文字，图标需要旋转回来 */
            margin-bottom: 8px; /* 增加图标底部间距 */
            width: 32px; /* 调大图标 */
            height: 32px;
            stroke: #000; /* 图标纯黑 */
        }

        /* 按钮滑光特效 - 动画模式 */
        .floating-btn::after {
            content: '';
            position: absolute;
            top: var(--light-top, -100%);
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0) 100%); /* 黑色微光扫过 */
            transform: skewY(-25deg);
            transition: top 0.1s ease-out; /* 为滚动流光添加平滑过渡 */
        }

        /* 自动动画的类，默认开启，滚动时移除 */
        .floating-btn.auto-light::after {
            animation: slideLight 3s infinite;
        }

        /* 悬浮时的放大和阴影加深效果 */
        .floating-btn:hover {
            transform: translateY(-50%) translateX(calc(-10px / var(--zoom-level, 1))) scale(calc(1.05 / var(--zoom-level, 1)));
            box-shadow: -10px 15px 25px rgba(0, 0, 0, 0.2); /* 悬停阴影 */
            background: #000; /* 悬停时反转为黑底白字 */
            color: #fff;
        }

        .floating-btn:hover svg {
            stroke: #fff; /* 悬停时图标反转为白色 */
        }

        /* 点击时的缩放效果 */
        .floating-btn:active {
            transform: translateY(-50%) translateX(0) scale(calc(0.95 / var(--zoom-level, 1)));
        }

        @keyframes slideLight {
            0% { top: -100%; }
            20% { top: 200%; }
            100% { top: 200%; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .floating-btn {
                right: 0;
                border-radius: 30px 0 0 30px;
                padding: 15px 20px;
                font-size: 18px;
            }
            .floating-btn svg {
                width: 24px;
                height: 24px;
            }
            .floating-btn:hover {
                transform: translateY(-50%) translateX(0) scale(calc(1.05 / var(--zoom-level, 1)));
            }
            .floating-btn:active {
                transform: translateY(-50%) translateX(0) scale(calc(0.95 / var(--zoom-level, 1)));
            }
        }
    </style>
</head>
<body>
    <div class="img-container">
        <img src="./AI转型实战研修海报图/1780292420268.jpg" alt="浙江大学AI实战研修班长图">
        <!-- <img src=/1780292420268.jpg" alt="浙江大学AI实战研修班长图"> -->
    </div>
    <script src="./shared/floating-teacher-btn.js" defer></script>
</body>
</html>
