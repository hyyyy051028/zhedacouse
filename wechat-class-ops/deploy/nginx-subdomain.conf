# /etc/nginx/conf.d/qd.yolodeep.fun.conf
# 把 qd.yolodeep.fun 反代到本机 3001 端口的 Node 服务
# 证书路径按实际文件名改（腾讯云下载的 Nginx 格式）

server {
    listen 80;
    server_name qd.yolodeep.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qd.yolodeep.fun;

    ssl_certificate     /etc/nginx/ssl/qd.yolodeep.fun_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/qd.yolodeep.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 上传/请求体不需要很大
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
